name: eAIP 원문 받기 (항로·공역 파서용)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: eAIP 받기
        run: node scripts/fetch-aip-raw.mjs /tmp/aip-raw
      - name: aip-raw 브랜치에 저장
        run: |
          cd /tmp/aip-raw
          git init -q -b aip-raw
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "eAIP raw $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" aip-raw
