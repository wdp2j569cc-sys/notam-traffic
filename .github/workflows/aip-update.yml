name: 항로·공역(eAIP) 갱신

on:
  schedule:
    - cron: '23 18 * * 3'   # 매주 목요일 03:23 KST (AIRAC·비AIRAC 개정 반영)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aip-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: eAIP 받기
        run: node scripts/fetch-aip-raw.mjs /tmp/aip/raw
      - name: 항로·공역 해석
        run: |
          PKG=$(grep -o 'using package: .*' /tmp/aip/raw/_log.txt | sed 's/using package: //')
          node scripts/parse-aip.mjs /tmp/aip/raw /tmp/aip/aip.json "$PKG"
      - name: aip-data 브랜치에 저장
        run: |
          cd /tmp/aip
          git init -q -b aip-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "eAIP $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" aip-data
