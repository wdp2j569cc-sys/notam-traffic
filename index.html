<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="내 주변 NOTAM">
<meta name="theme-color" content="#0f1419">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>내 주변 NOTAM</title>
<style>
:root { --bg:#0f1419; --card:#1a2129; --line:#2a333d; --fg:#e6edf3; --dim:#8b98a5; --acc:#4da3ff; --red:#ff6b6b; --yel:#f5c451; --grn:#5fd38d; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.45 -apple-system, system-ui, sans-serif;
  padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
header { position:sticky; top:0; z-index:5; background:var(--bg); padding:10px 14px 8px; border-bottom:1px solid var(--line); }
h1 { font-size:20px; margin:0 0 6px; display:flex; justify-content:space-between; align-items:center; }
h1 a { font-size:14px; color:var(--acc); text-decoration:none; font-weight:400; }
.row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
button, select { min-height:44px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--fg); font-size:16px; padding:0 12px; }
button.main { background:var(--acc); border-color:var(--acc); color:#fff; font-weight:600; flex:1; }
.seg { display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
.seg button { border:0; border-radius:0; min-width:56px; }
.seg button.on { background:var(--acc); color:#fff; }
#status { color:var(--dim); font-size:13px; margin-top:6px; }
#status .warn { color:var(--yel); }
main { padding:10px 14px 40px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px; }
.card.inside { border-color:var(--red); }
.top { display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
.cat { font-weight:700; }
.dist { color:var(--dim); font-size:14px; white-space:nowrap; }
.badge { display:inline-block; font-size:12px; padding:1px 7px; border-radius:6px; margin-right:4px; font-weight:600; }
.b-in { background:var(--red); color:#fff; } .b-act { background:var(--grn); color:#06210f; } .b-soon { background:var(--yel); color:#2a2000; } .b-off { background:var(--line); color:var(--dim); }
.meta { color:var(--dim); font-size:13px; margin:4px 0; }
.txt { white-space:pre-wrap; font-family: ui-monospace, Menlo, monospace; font-size:13px; margin-top:6px; }
.txt.clip { max-height:5.6em; overflow:hidden; -webkit-mask-image:linear-gradient(#000 60%, transparent); }
details { margin-top:12px; } summary { color:var(--acc); min-height:44px; display:flex; align-items:center; }
.empty { color:var(--dim); text-align:center; padding:30px 10px; }
textarea { width:100%; min-height:160px; background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:10px; padding:8px; font:13px ui-monospace, Menlo, monospace; }
.note { color:var(--dim); font-size:12px; margin-top:16px; }
</style>
</head>
<body>
<header>
  <h1>내 주변 NOTAM <a href="full.html">지도·항적 ›</a></h1>
  <div class="row">
    <button class="main" id="locBtn">📍 내 위치로 조회</button>
    <select id="radius" aria-label="반경">
      <option value="5">5 NM</option><option value="10">10 NM</option><option value="25" selected>25 NM</option><option value="50">50 NM</option><option value="100">100 NM</option>
    </select>
  </div>
  <div class="row" style="margin-top:8px">
    <div class="seg" id="win">
      <button data-h="0" class="on">지금</button><button data-h="6">6시간</button><button data-h="24">24시간</button><button data-h="72">3일</button>
    </div>
  </div>
  <div id="status">위치를 확인하는 중…</div>
</header>
<main>
  <div id="list"></div>
  <details id="wideBox"><summary id="wideSum">FIR 전체 적용 NOTAM</summary><div id="wide"></div></details>
  <details><summary>NOTAM 원문 직접 붙여넣기</summary>
    <p class="meta">AIM Korea 등에서 복사한 원문을 붙이면 자동 수집분과 합쳐서 내 위치 기준으로 걸러 줍니다.</p>
    <textarea id="paste" placeholder="A1234/26 NOTAMN&#10;Q) RKRR/QRDCA/...&#10;A) ... B) ... C) ...&#10;E) ..."></textarea>
    <div class="row" style="margin-top:8px"><button id="pasteBtn">적용</button><button id="pasteClr">지우기</button></div>
  </details>
  <p class="note">⚠︎ 참고용입니다. 비행 전 반드시 공식 브리핑(AIM Korea, 관할 기관)으로 확인하세요.
  데이터는 GitHub Actions가 FAA NOTAM Search에서 약 30분마다 받아 옵니다. 국내 NOTAM 일부가 빠지거나 늦을 수 있습니다.</p>
</main>
<script src="notam.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

/** GitHub Pages 주소에서 데이터 주소 추정: https://<계정>.github.io/<레포>/ → raw notam-data 브랜치 */
function dataUrl() {
  const custom = new URLSearchParams(location.search).get('data');
  if (custom) return custom;
  const h = location.hostname, seg = location.pathname.split('/').filter(Boolean)[0];
  if (h.endsWith('.github.io') && seg) {
    return `https://raw.githubusercontent.com/${h.split('.')[0]}/${seg}/notam-data/notams.json`;
  }
  return 'notams.json'; // 로컬 시험용
}

const state = {
  pos: store.get('nn_pos', null),           // {lat, lon, acc, t}
  radius: store.get('nn_radius', 25),
  hours: store.get('nn_hours', 0),
  data: store.get('nn_data', null),         // {updated, source, notams:[raw]}
  pasted: store.get('nn_paste', ''),
  fetchErr: null
};
$('radius').value = String(state.radius);
$('paste').value = state.pasted;
document.querySelectorAll('#win button').forEach(b => b.classList.toggle('on', +b.dataset.h === state.hours));

const DIRS = ['북', '북동', '동', '남동', '남', '남서', '서', '북서'];
const dirName = deg => DIRS[Math.round(deg / 45) % 8];
const kst = d => d ? new Date(d.getTime() + 9 * 3600e3).toISOString().slice(5, 16).replace('-', '/').replace('T', ' ') : '';
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

function ago(iso) {
  const m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (m < 1) return '방금'; if (m < 60) return m + '분 전';
  if (m < 1440) return Math.floor(m / 60) + '시간 전'; return Math.floor(m / 1440) + '일 전';
}

/** 고도 표기: F/G 항목 우선, 없으면 Q라인 FL */
function altText(n) {
  if (n.lower || n.upper) return `${n.lower || '?'} ~ ${n.upper || '?'}`;
  if (n.lowerFL != null && n.upperFL != null) return `FL${String(n.lowerFL).padStart(3, '0')} ~ FL${String(n.upperFL).padStart(3, '0')}`;
  return '';
}

function card(n, now) {
  const a = n.area, inside = a.basis === 'inside';
  const s = n.start ? n.start.getTime() : -Infinity, e = n.end ? n.end.getTime() : Infinity;
  let badge;
  if (s > now) badge = `<span class="badge b-soon">${kst(n.start)} 시작</span>`;
  else if (n.schedOk === false) badge = '<span class="badge b-off">시간대 외</span>';
  else badge = '<span class="badge b-act">유효</span>';
  if (inside) badge = '<span class="badge b-in">현재 위치 포함</span>' + badge;
  let dist = '';
  if (a.basis === 'qcircle' && a.distNm === 0) dist = 'Q원 범위 안';
  else if (a.distNm != null && !inside) {
    const c = n.geoms[0] ? (n.geoms[0].center || n.geoms[0].pts[0]) : (n.q ? [n.q.lat, n.q.lon] : null);
    dist = `${a.distNm < 10 ? a.distNm.toFixed(1) : Math.round(a.distNm)} NM` +
      (c ? ' ' + dirName(NOTAM.bearingDeg(state.pos.lat, state.pos.lon, c[0], c[1])) : '') + (a.basis === 'qcircle' ? ' (Q원 경계)' : '');
  } else if (a.basis === 'location') dist = (n.locations || []).join(' ');
  const alt = altText(n);
  const valid = `${n.start ? kst(n.start) : '?'} ~ ${n.perm ? 'PERM' : n.end ? kst(n.end) : '?'}${n.est ? ' EST' : ''} KST`;
  const long = (n.text || n.raw).length > 160;
  return `<div class="card${inside ? ' inside' : ''}">
    <div class="top"><span class="cat">${esc(NOTAM.qCategory(n.qcode))}</span><span class="dist">${esc(dist)}</span></div>
    <div class="meta">${badge}${esc(n.id || '')} ${esc((n.locations || []).join(' '))}</div>
    <div class="meta">🕒 ${esc(valid)}${n.schedule ? '<br>⏱ ' + esc(n.schedule) : ''}${alt ? '<br>↕ ' + esc(alt) : ''}</div>
    <div class="txt${long ? ' clip' : ''}" onclick="this.classList.remove('clip')">${esc(n.text || n.raw)}</div>
  </div>`;
}

function allNotams() {
  const raws = [];
  if (state.data && state.data.notams) raws.push(...state.data.notams);
  if (state.pasted.trim()) raws.push(...NOTAM.splitNotams(state.pasted));
  return raws.map(r => { try { return NOTAM.parseNotam(r); } catch (e) { return null; } }).filter(Boolean);
}

function render() {
  const st = [];
  if (state.data) st.push(`데이터 ${ago(state.data.updated)} · ${state.data.notams.length}건`);
  if (state.fetchErr) st.push(`<span class="warn">갱신 실패(${esc(state.fetchErr)})${state.data ? ' — 저장된 데이터 표시' : ''}</span>`);
  if (state.data && Date.now() - new Date(state.data.updated) > 3 * 3600e3) st.push('<span class="warn">데이터가 오래됨</span>');
  if (state.pos) st.push(`위치 ${state.pos.lat.toFixed(3)}, ${state.pos.lon.toFixed(3)} (${ago(state.pos.t)})`);
  $('status').innerHTML = st.join(' · ') || '위치를 확인하는 중…';

  if (!state.pos) { $('list').innerHTML = '<div class="empty">📍 버튼을 눌러 위치 사용을 허용하세요.</div>'; $('wideBox').hidden = true; return; }
  const list = allNotams();
  if (!list.length) {
    $('list').innerHTML = `<div class="empty">NOTAM 데이터가 없습니다.<br>${state.fetchErr ? '자동 수집 데이터를 받지 못했습니다. 아래에 원문을 붙여넣을 수 있습니다.' : '불러오는 중…'}</div>`;
    $('wideBox').hidden = true; return;
  }
  const now = Date.now();
  const winStart = new Date(now), winEnd = new Date(now + Math.max(state.hours, 0.01) * 3600e3);
  const opts = { lat: state.pos.lat, lon: state.pos.lon, radiusNm: state.radius, winStart, winEnd, includeWide: true };
  const res = NOTAM.filterNotams(list, opts);
  const local = res.filter(n => n.area.basis !== 'wide');
  const wide = res.filter(n => n.area.basis === 'wide');
  local.sort((a, b) => (b.area.basis === 'inside') - (a.area.basis === 'inside'));
  $('list').innerHTML = local.length ? local.map(n => card(n, now)).join('')
    : `<div class="empty">반경 ${state.radius} NM 안에 해당 시간 NOTAM이 없습니다.<br>(수집 대상 ${state.data ? (state.data.locations || []).length : 0}개 위치지시자 기준)</div>`;
  $('wideBox').hidden = !wide.length;
  $('wideSum').textContent = `FIR 전체 적용 NOTAM ${wide.length}건`;
  $('wide').innerHTML = wide.map(n => card(n, now)).join('');
}

async function loadData() {
  try {
    const r = await fetch(dataUrl() + (dataUrl().includes('?') ? '&' : '?') + 't=' + Math.floor(Date.now() / 60000), { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status === 404 ? '데이터 없음(Actions 실행 전)' : 'HTTP ' + r.status);
    const d = await r.json();
    if (!Array.isArray(d.notams)) throw new Error('형식 오류');
    state.data = { updated: d.updated, source: d.source, locations: d.locations, notams: d.notams };
    state.fetchErr = null;
    store.set('nn_data', state.data);
  } catch (e) {
    state.fetchErr = navigator.onLine === false ? '오프라인' : e.message;
  }
  render();
}

function locate() {
  if (!navigator.geolocation) { $('status').textContent = '이 브라우저는 위치를 지원하지 않습니다.'; return; }
  $('locBtn').textContent = '📍 위치 확인 중…';
  navigator.geolocation.getCurrentPosition(p => {
    state.pos = { lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy, t: new Date().toISOString() };
    store.set('nn_pos', state.pos);
    $('locBtn').textContent = '📍 내 위치로 조회';
    render();
  }, err => {
    $('locBtn').textContent = '📍 내 위치로 조회';
    const msg = err.code === 1 ? '위치 권한이 거부됨: 설정 › 개인정보 보호 › 위치 서비스 › Safari 웹사이트 › "앱을 사용하는 동안"' : '위치를 가져오지 못했습니다';
    $('status').innerHTML = `<span class="warn">${msg}</span>` + (state.pos ? ' — 마지막 위치 사용' : '');
    render();
  }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
}

$('locBtn').onclick = () => { locate(); loadData(); };
$('radius').onchange = e => { state.radius = +e.target.value; store.set('nn_radius', state.radius); render(); };
document.querySelectorAll('#win button').forEach(b => b.onclick = () => {
  state.hours = +b.dataset.h; store.set('nn_hours', state.hours);
  document.querySelectorAll('#win button').forEach(x => x.classList.toggle('on', x === b)); render();
});
$('pasteBtn').onclick = () => { state.pasted = $('paste').value; store.set('nn_paste', state.pasted); render(); };
$('pasteClr').onclick = () => { $('paste').value = state.pasted = ''; store.set('nn_paste', ''); render(); };
document.addEventListener('visibilitychange', () => { if (!document.hidden) { locate(); loadData(); } });

render();
locate();
loadData();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
